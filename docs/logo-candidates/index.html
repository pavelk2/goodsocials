<!doctype html>
<meta charset="utf-8">
<title>GoodSocials logo candidates</title>
<style>
  :root { color-scheme: light }
  html { background: #F4F4F4 }
  body { margin: 0; padding: 56px 48px 64px; font: 15px/1.45 -apple-system, "Segoe UI", system-ui, sans-serif; color: #000000; -webkit-font-smoothing: antialiased }
  h1 { font-size: 34px; letter-spacing: -0.02em; margin: 0 0 4px; font-weight: 600 }
  h1 span { color: #6E6E73 }
  p.sub { color: #6E6E73; margin: 0 0 44px; font-size: 15px }
  .grid { display: grid; grid-template-columns: repeat(4, 200px); gap: 40px 48px }
  figure { margin: 0 }
  img { display: block; background: #F4F4F4; border: 1px solid #E6E6E6; border-radius: 4px }
  figcaption { display: block; padding-top: 12px }
  figcaption b { display: block; font-weight: 600; font-size: 14px; font-variant-numeric: tabular-nums }
  figcaption span { display: block; color: #6E6E73; font-size: 13px; padding-top: 2px }
</style>
<h1>GoodSocials logo candidates <span>24 marks, 200 by 200, one accent each.</span></h1>
<p class="sub">Palette fixed by DESIGN.md: paper #F4F4F4, ink #000000, accent #E8590C. Source SVG next to every PNG.</p>
<div class="grid"><figure>
      <img src="png/01-g-open.png" width="200" height="200" alt="G, open">
      <figcaption><b>01 G, open</b><span>Geometric G. The crossbar is the only colour.</span></figcaption>
    </figure><figure>
      <img src="png/02-g-heavy.png" width="200" height="200" alt="G, heavy">
      <figcaption><b>02 G, heavy</b><span>Same construction at display weight. Square terminal in accent.</span></figcaption>
    </figure><figure>
      <img src="png/03-g-tile.png" width="200" height="200" alt="G, dark tile">
      <figcaption><b>03 G, dark tile</b><span>App icon weight. Same mark knocked out of ink.</span></figcaption>
    </figure><figure>
      <img src="png/04-g-badge.png" width="200" height="200" alt="G, accent badge">
      <figcaption><b>04 G, accent badge</b><span>Spends the whole accent budget in one disc. Loudest option.</span></figcaption>
    </figure><figure>
      <img src="png/05-board-bars.png" width="200" height="200" alt="Five columns">
      <figcaption><b>05 Five columns</b><span>Idea, Draft, Image, Scheduled, Posted. Posted is the accent.</span></figcaption>
    </figure><figure>
      <img src="png/06-board-tile.png" width="200" height="200" alt="Five columns, tile">
      <figcaption><b>06 Five columns, tile</b><span>The board as an app icon. Survives 16px.</span></figcaption>
    </figure><figure>
      <img src="png/07-board-cards.png" width="200" height="200" alt="Cards in columns">
      <figcaption><b>07 Cards in columns</b><span>Three columns, uneven counts. A real board is never balanced.</span></figcaption>
    </figure><figure>
      <img src="png/08-board-move.png" width="200" height="200" alt="Card moved">
      <figcaption><b>08 Card moved</b><span>The one card that just changed column.</span></figcaption>
    </figure><figure>
      <img src="png/09-check-tile.png" width="200" height="200" alt="Approve, tile">
      <figcaption><b>09 Approve, tile</b><span>The only action that matters, cut out of ink.</span></figcaption>
    </figure><figure>
      <img src="png/10-check-accent.png" width="200" height="200" alt="Approve, accent">
      <figcaption><b>10 Approve, accent</b><span>Bare mark. Nothing to shrink badly.</span></figcaption>
    </figure><figure>
      <img src="png/11-check-ring.png" width="200" height="200" alt="Approve, ring">
      <figcaption><b>11 Approve, ring</b><span>Ring holds it together in a round avatar crop.</span></figcaption>
    </figure><figure>
      <img src="png/12-queue-check.png" width="200" height="200" alt="Queue approved">
      <figcaption><b>12 Queue approved</b><span>Three drafts waiting, one approval. The whole product.</span></figcaption>
    </figure><figure>
      <img src="png/13-streak-dots.png" width="200" height="200" alt="Streak, dots">
      <figcaption><b>13 Streak, dots</b><span>Posting history. Filled is published, grey is ahead of today.</span></figcaption>
    </figure><figure>
      <img src="png/14-streak-grid.png" width="200" height="200" alt="Streak, grid">
      <figcaption><b>14 Streak, grid</b><span>Contribution grid. Reads as regularity without a single word.</span></figcaption>
    </figure><figure>
      <img src="png/15-week.png" width="200" height="200" alt="Seven days">
      <figcaption><b>15 Seven days</b><span>Four posted, today publishing, two scheduled.</span></figcaption>
    </figure><figure>
      <img src="png/16-cadence-steps.png" width="200" height="200" alt="Cadence, rising">
      <figcaption><b>16 Cadence, rising</b><span>Volume going up. Closest thing here to a chart, which is a risk.</span></figcaption>
    </figure><figure>
      <img src="png/17-post-card.png" width="200" height="200" alt="Post card">
      <figcaption><b>17 Post card</b><span>A drafted post. The last line is still being written.</span></figcaption>
    </figure><figure>
      <img src="png/18-bubble.png" width="200" height="200" alt="Bubble">
      <figcaption><b>18 Bubble</b><span>Says social without saying LinkedIn.</span></figcaption>
    </figure><figure>
      <img src="png/19-bubble-check.png" width="200" height="200" alt="Bubble approved">
      <figcaption><b>19 Bubble approved</b><span>Content plus consent, one shape.</span></figcaption>
    </figure><figure>
      <img src="png/20-card-approved.png" width="200" height="200" alt="Card approved">
      <figcaption><b>20 Card approved</b><span>The approval queue, literally. Busiest mark in the set.</span></figcaption>
    </figure><figure>
      <img src="png/21-gs-pair.png" width="200" height="200" alt="GS, pair">
      <figcaption><b>21 GS, pair</b><span>Two letters, one weight, drawn on the same circle grid.</span></figcaption>
    </figure><figure>
      <img src="png/22-gs-stack.png" width="200" height="200" alt="GS, stacked">
      <figcaption><b>22 GS, stacked</b><span>Square lockup. Two letters at one weight, stacked.</span></figcaption>
    </figure><figure>
      <img src="png/23-g-stop.png" width="200" height="200" alt="G, full stop">
      <figcaption><b>23 G, full stop</b><span>Posted. The dot is the whole tone of voice.</span></figcaption>
    </figure><figure>
      <img src="png/24-gs-tile.png" width="200" height="200" alt="GS, dark tile">
      <figcaption><b>24 GS, dark tile</b><span>The pair on ink. Safest thing to put on a dark LinkedIn avatar.</span></figcaption>
    </figure></div>
