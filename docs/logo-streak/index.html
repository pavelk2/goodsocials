<!doctype html>
<meta charset="utf-8">
<title>GoodSocials streak mark</title>
<style>
  :root { color-scheme: light }
  html { background: #F4F4F4 }
  body { margin: 0; padding: 56px 48px 64px; font: 15px/1.45 -apple-system, "Segoe UI", system-ui, sans-serif; color: #000000; -webkit-font-smoothing: antialiased }
  h1 { font-size: 34px; letter-spacing: -0.02em; margin: 0 0 4px; font-weight: 600 }
  h1 span { color: #6E6E73 }
  p.sub { color: #6E6E73; margin: 0 0 44px; font-size: 15px }
  .grid { display: grid; grid-template-columns: repeat(4, 200px); gap: 40px 48px }
  figure { margin: 0 }
  img.big { display: block; background: #F4F4F4; border: 1px solid #E6E6E6; border-radius: 4px }
  img.tiny { vertical-align: -5px; margin-right: 8px; border: 1px solid #E6E6E6 }
  figcaption { display: block; padding-top: 12px }
  figcaption b { display: block; font-weight: 600; font-size: 14px; font-variant-numeric: tabular-nums }
  figcaption span { display: block; color: #6E6E73; font-size: 13px; padding-top: 4px }
</style>
<h1>Streak mark <span>24 variations on one idea: a cell per day, one accent for today.</span></h1>
<p class="sub">Every caption carries the same mark at 24px, which is where most of these get decided.</p>
<div class="grid"><figure>
      <img class="big" src="png/01-base.png" width="200" height="200" alt="Base">
      <figcaption>
        <b><img class="tiny" src="png/01-base.png" width="24" height="24" alt="">01 Base</b>
        <span>The mark you picked, unchanged. Everything here is measured against it.</span>
      </figcaption>
    </figure><figure>
      <img class="big" src="png/02-dense-36.png" width="200" height="200" alt="Denser, 36">
      <figcaption>
        <b><img class="tiny" src="png/02-dense-36.png" width="24" height="24" alt="">02 Denser, 36</b>
        <span>More days in the same frame. Reads as texture before it reads as days.</span>
      </figcaption>
    </figure><figure>
      <img class="big" src="png/03-month-28.png" width="200" height="200" alt="Four weeks">
      <figcaption>
        <b><img class="tiny" src="png/03-month-28.png" width="24" height="24" alt="">03 Four weeks</b>
        <span>Seven across, so the rows are actual weeks. Wide, not square.</span>
      </figcaption>
    </figure><figure>
      <img class="big" src="png/04-big-16.png" width="200" height="200" alt="Sixteen, large">
      <figcaption>
        <b><img class="tiny" src="png/04-big-16.png" width="24" height="24" alt="">04 Sixteen, large</b>
        <span>Fewest cells, biggest dots. The version that survives a favicon.</span>
      </figcaption>
    </figure><figure>
      <img class="big" src="png/05-month-35.png" width="200" height="200" alt="Full month">
      <figcaption>
        <b><img class="tiny" src="png/05-month-35.png" width="24" height="24" alt="">05 Full month</b>
        <span>Thirty five cells. Honest to the dashboard, busy as a mark.</span>
      </figcaption>
    </figure><figure>
      <img class="big" src="png/06-airy.png" width="200" height="200" alt="Airy">
      <figcaption>
        <b><img class="tiny" src="png/06-airy.png" width="24" height="24" alt="">06 Airy</b>
        <span>Same grid, more space between days. Calmer, weaker at small sizes.</span>
      </figcaption>
    </figure><figure>
      <img class="big" src="png/07-rounded.png" width="200" height="200" alt="Rounded cells">
      <figcaption>
        <b><img class="tiny" src="png/07-rounded.png" width="24" height="24" alt="">07 Rounded cells</b>
        <span>Squares with the card radius. Closer to the board, further from a chart.</span>
      </figcaption>
    </figure><figure>
      <img class="big" src="png/08-square.png" width="200" height="200" alt="Hard squares">
      <figcaption>
        <b><img class="tiny" src="png/08-square.png" width="24" height="24" alt="">08 Hard squares</b>
        <span>No radius anywhere. The most engineered of the set.</span>
      </figcaption>
    </figure><figure>
      <img class="big" src="png/09-hollow-future.png" width="200" height="200" alt="Hollow future">
      <figcaption>
        <b><img class="tiny" src="png/09-hollow-future.png" width="24" height="24" alt="">09 Hollow future</b>
        <span>The days ahead are outlines. The grid stays legible without filling in.</span>
      </figcaption>
    </figure><figure>
      <img class="big" src="png/10-three-states.png" width="200" height="200" alt="Three states">
      <figcaption>
        <b><img class="tiny" src="png/10-three-states.png" width="24" height="24" alt="">10 Three states</b>
        <span>Posted, publishing, scheduled, empty. The whole queue in one mark.</span>
      </figcaption>
    </figure><figure>
      <img class="big" src="png/11-diagonal.png" width="200" height="200" alt="Diagonal run">
      <figcaption>
        <b><img class="tiny" src="png/11-diagonal.png" width="24" height="24" alt="">11 Diagonal run</b>
        <span>The streak crosses the field instead of filling it. Prettiest, least true.</span>
      </figcaption>
    </figure><figure>
      <img class="big" src="png/12-accent-row.png" width="200" height="200" alt="This week">
      <figcaption>
        <b><img class="tiny" src="png/12-accent-row.png" width="24" height="24" alt="">12 This week</b>
        <span>One row in accent. Reads as a week rather than a day.</span>
      </figcaption>
    </figure><figure>
      <img class="big" src="png/13-broken.png" width="200" height="200" alt="Broken streak">
      <figcaption>
        <b><img class="tiny" src="png/13-broken.png" width="24" height="24" alt="">13 Broken streak</b>
        <span>One day missed, in the middle. Honest, and a strange thing to put on a logo.</span>
      </figcaption>
    </figure><figure>
      <img class="big" src="png/14-columns.png" width="200" height="200" alt="Filled by column">
      <figcaption>
        <b><img class="tiny" src="png/14-columns.png" width="24" height="24" alt="">14 Filled by column</b>
        <span>The run reads top to bottom. Same data, a board rather than a calendar.</span>
      </figcaption>
    </figure><figure>
      <img class="big" src="png/15-today-large.png" width="200" height="200" alt="Today, large">
      <figcaption>
        <b><img class="tiny" src="png/15-today-large.png" width="24" height="24" alt="">15 Today, large</b>
        <span>Scale carries today instead of colour. Breaks the grid on purpose.</span>
      </figcaption>
    </figure><figure>
      <img class="big" src="png/16-today-ringed.png" width="200" height="200" alt="Today, ringed">
      <figcaption>
        <b><img class="tiny" src="png/16-today-ringed.png" width="24" height="24" alt="">16 Today, ringed</b>
        <span>A ring around the current day. One more part to lose at 16px.</span>
      </figcaption>
    </figure><figure>
      <img class="big" src="png/17-no-future.png" width="200" height="200" alt="Ragged edge">
      <figcaption>
        <b><img class="tiny" src="png/17-no-future.png" width="24" height="24" alt="">17 Ragged edge</b>
        <span>The days ahead are not drawn at all. Strongest silhouette in the set.</span>
      </figcaption>
    </figure><figure>
      <img class="big" src="png/18-two-greys.png" width="200" height="200" alt="Scheduled ahead">
      <figcaption>
        <b><img class="tiny" src="png/18-two-greys.png" width="24" height="24" alt="">18 Scheduled ahead</b>
        <span>Grey for what is already queued. Says the board is not empty.</span>
      </figcaption>
    </figure><figure>
      <img class="big" src="png/19-tile-dots.png" width="200" height="200" alt="Dark tile">
      <figcaption>
        <b><img class="tiny" src="png/19-tile-dots.png" width="24" height="24" alt="">19 Dark tile</b>
        <span>App icon. The empty days are a tint of the tile, not a hole in it.</span>
      </figcaption>
    </figure><figure>
      <img class="big" src="png/20-tile-month.png" width="200" height="200" alt="Dark tile, weeks">
      <figcaption>
        <b><img class="tiny" src="png/20-tile-month.png" width="24" height="24" alt="">20 Dark tile, weeks</b>
        <span>Seven across on ink. Reads as a calendar at a glance.</span>
      </figcaption>
    </figure><figure>
      <img class="big" src="png/21-tile-rounded.png" width="200" height="200" alt="Dark tile, cells">
      <figcaption>
        <b><img class="tiny" src="png/21-tile-rounded.png" width="24" height="24" alt="">21 Dark tile, cells</b>
        <span>Rounded cells on ink. Closest to the board it comes from.</span>
      </figcaption>
    </figure><figure>
      <img class="big" src="png/22-g-of-dots.png" width="200" height="200" alt="G of days">
      <figcaption>
        <b><img class="tiny" src="png/22-g-of-dots.png" width="24" height="24" alt="">22 G of days</b>
        <span>The grid spells the letter. Carries the name and the cadence at once.</span>
      </figcaption>
    </figure><figure>
      <img class="big" src="png/23-ring-of-days.png" width="200" height="200" alt="Ring of days">
      <figcaption>
        <b><img class="tiny" src="png/23-ring-of-days.png" width="24" height="24" alt="">23 Ring of days</b>
        <span>Twelve days around a circle. Sits well in a round avatar crop.</span>
      </figcaption>
    </figure><figure>
      <img class="big" src="png/24-disc.png" width="200" height="200" alt="Disc of days">
      <figcaption>
        <b><img class="tiny" src="png/24-disc.png" width="24" height="24" alt="">24 Disc of days</b>
        <span>The grid cropped to a circle, whole cells only. A mark, not a chart.</span>
      </figcaption>
    </figure></div>
