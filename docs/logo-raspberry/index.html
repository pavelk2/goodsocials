<!doctype html>
<meta charset="utf-8">
<title>GoodSocials raspberry mark</title>
<style>
  :root { color-scheme: light }
  html { background: #F4F4F4 }
  body { margin: 0; padding: 56px 48px 64px; font: 15px/1.45 -apple-system, "Segoe UI", system-ui, sans-serif; color: #000000; -webkit-font-smoothing: antialiased }
  h1 { font-size: 34px; letter-spacing: -0.02em; margin: 0 0 4px; font-weight: 600 }
  h1 span { color: #6E6E73 }
  p.sub { color: #6E6E73; margin: 0 0 44px; font-size: 15px; max-width: 780px }
  .grid { display: grid; grid-template-columns: repeat(4, 200px); gap: 40px 48px }
  figure { margin: 0 }
  img.big { display: block; background: #F4F4F4; border: 1px solid #E6E6E6; border-radius: 4px }
  img.tiny { vertical-align: -5px; margin-right: 8px; border: 1px solid #E6E6E6 }
  figcaption { display: block; padding-top: 12px }
  figcaption b { display: block; font-weight: 600; font-size: 14px; font-variant-numeric: tabular-nums }
  figcaption span { display: block; color: #6E6E73; font-size: 13px; padding-top: 4px }
</style>
<h1>Raspberry mark <span>The streak grid, packed into fruit.</span></h1>
<p class="sub">Eighteen drupelets, which is the number of cells the streak mark fills, so the fruit and the calendar are the same object. Raspberry is #C2255C. Every caption repeats the mark at 24px.</p>
<div class="grid"><figure>
      <img class="big" src="png/01-berry.png" width="200" height="200" alt="Berry">
      <figcaption>
        <b><img class="tiny" src="png/01-berry.png" width="24" height="24" alt="">01 Berry</b>
        <span>Eighteen drupelets, the same count the streak mark fills. No decoration.</span>
      </figcaption>
    </figure><figure>
      <img class="big" src="png/02-berry-leaf.png" width="200" height="200" alt="Berry, one leaf">
      <figcaption>
        <b><img class="tiny" src="png/02-berry-leaf.png" width="24" height="24" alt="">02 Berry, one leaf</b>
        <span>One ink leaf. Reads as fruit a second faster, costs a part at small sizes.</span>
      </figcaption>
    </figure><figure>
      <img class="big" src="png/03-berry-two-leaves.png" width="200" height="200" alt="Berry, two leaves">
      <figcaption>
        <b><img class="tiny" src="png/03-berry-two-leaves.png" width="24" height="24" alt="">03 Berry, two leaves</b>
        <span>A hull rather than a leaf. More botanical, less mark.</span>
      </figcaption>
    </figure><figure>
      <img class="big" src="png/04-berry-stem.png" width="200" height="200" alt="Berry, stem">
      <figcaption>
        <b><img class="tiny" src="png/04-berry-stem.png" width="24" height="24" alt="">04 Berry, stem</b>
        <span>A 6px ink stem instead of a leaf. Survives the favicon that a leaf does not.</span>
      </figcaption>
    </figure><figure>
      <img class="big" src="png/05-berry-ink-hull.png" width="200" height="200" alt="Ink hull">
      <figcaption>
        <b><img class="tiny" src="png/05-berry-ink-hull.png" width="24" height="24" alt="">05 Ink hull</b>
        <span>The top row is the hull, in ink. One shape, two materials, no extra parts.</span>
      </figcaption>
    </figure><figure>
      <img class="big" src="png/06-berry-today.png" width="200" height="200" alt="Today, ink">
      <figcaption>
        <b><img class="tiny" src="png/06-berry-today.png" width="24" height="24" alt="">06 Today, ink</b>
        <span>The whole fruit is the accent, so today has to be ink. Inverts the usual rule.</span>
      </figcaption>
    </figure><figure>
      <img class="big" src="png/07-berry-fills.png" width="200" height="200" alt="Fruit fills">
      <figcaption>
        <b><img class="tiny" src="png/07-berry-fills.png" width="24" height="24" alt="">07 Fruit fills</b>
        <span>Posted days are drupelets, the rest are outlines. The berry completes as the month does.</span>
      </figcaption>
    </figure><figure>
      <img class="big" src="png/08-berry-calendar.png" width="200" height="200" alt="Calendar, berry shaped">
      <figcaption>
        <b><img class="tiny" src="png/08-berry-calendar.png" width="24" height="24" alt="">08 Calendar, berry shaped</b>
        <span>Ink for posted, raspberry for today, hairline ahead. The old logic in the new silhouette.</span>
      </figcaption>
    </figure><figure>
      <img class="big" src="png/09-berry-square.png" width="200" height="200" alt="Unpacked rows">
      <figcaption>
        <b><img class="tiny" src="png/09-berry-square.png" width="24" height="24" alt="">09 Unpacked rows</b>
        <span>Rows sit square instead of interlocking. More calendar, less fruit.</span>
      </figcaption>
    </figure><figure>
      <img class="big" src="png/10-berry-cells.png" width="200" height="200" alt="Cells, not dots">
      <figcaption>
        <b><img class="tiny" src="png/10-berry-cells.png" width="24" height="24" alt="">10 Cells, not dots</b>
        <span>Drupelets as board cards. The mark comes from the product rather than the fruit.</span>
      </figcaption>
    </figure><figure>
      <img class="big" src="png/11-berry-taper.png" width="200" height="200" alt="Tapered">
      <figcaption>
        <b><img class="tiny" src="png/11-berry-taper.png" width="24" height="24" alt="">11 Tapered</b>
        <span>Drupelets shrink toward the point. Rounder, and it stops being a grid.</span>
      </figcaption>
    </figure><figure>
      <img class="big" src="png/12-berry-tight.png" width="200" height="200" alt="Tight packing">
      <figcaption>
        <b><img class="tiny" src="png/12-berry-tight.png" width="24" height="24" alt="">12 Tight packing</b>
        <span>Almost touching. Reads as one object before it reads as cells.</span>
      </figcaption>
    </figure><figure>
      <img class="big" src="png/13-berry-loose.png" width="200" height="200" alt="Loose packing">
      <figcaption>
        <b><img class="tiny" src="png/13-berry-loose.png" width="24" height="24" alt="">13 Loose packing</b>
        <span>Air between the drupelets. Keeps the calendar reading, weakens the fruit.</span>
      </figcaption>
    </figure><figure>
      <img class="big" src="png/14-berry-big.png" width="200" height="200" alt="Six drupelets">
      <figcaption>
        <b><img class="tiny" src="png/14-berry-big.png" width="24" height="24" alt="">14 Six drupelets</b>
        <span>Fewest parts, biggest cells. The version that still works at 16px.</span>
      </figcaption>
    </figure><figure>
      <img class="big" src="png/15-berry-round.png" width="200" height="200" alt="Round berry">
      <figcaption>
        <b><img class="tiny" src="png/15-berry-round.png" width="24" height="24" alt="">15 Round berry</b>
        <span>Widest in the middle, not at the top. Closer to a blackberry than a raspberry.</span>
      </figcaption>
    </figure><figure>
      <img class="big" src="png/16-berry-deep.png" width="200" height="200" alt="Deep raspberry">
      <figcaption>
        <b><img class="tiny" src="png/16-berry-deep.png" width="24" height="24" alt="">16 Deep raspberry</b>
        <span>The darker plum at #A61E4D. Heavier, and the type next to it can stay black.</span>
      </figcaption>
    </figure><figure>
      <img class="big" src="png/17-grid-berry.png" width="200" height="200" alt="Grid, berry coloured">
      <figcaption>
        <b><img class="tiny" src="png/17-grid-berry.png" width="24" height="24" alt="">17 Grid, berry coloured</b>
        <span>The mark you picked, recoloured. Square, and no fruit at all.</span>
      </figcaption>
    </figure><figure>
      <img class="big" src="png/18-grid-cornerless.png" width="200" height="200" alt="Grid, corners off">
      <figcaption>
        <b><img class="tiny" src="png/18-grid-cornerless.png" width="24" height="24" alt="">18 Grid, corners off</b>
        <span>A 5 by 5 with the four corners dropped. The calendar rounding into a berry.</span>
      </figcaption>
    </figure><figure>
      <img class="big" src="png/19-tile-berry.png" width="200" height="200" alt="Dark tile">
      <figcaption>
        <b><img class="tiny" src="png/19-tile-berry.png" width="24" height="24" alt="">19 Dark tile</b>
        <span>App icon. Raspberry on ink is the strongest pairing in the set.</span>
      </figcaption>
    </figure><figure>
      <img class="big" src="png/20-tile-leaf.png" width="200" height="200" alt="Dark tile, leaf">
      <figcaption>
        <b><img class="tiny" src="png/20-tile-leaf.png" width="24" height="24" alt="">20 Dark tile, leaf</b>
        <span>The leaf in white so it reads against the tile.</span>
      </figcaption>
    </figure><figure>
      <img class="big" src="png/21-tile-fills.png" width="200" height="200" alt="Dark tile, filling">
      <figcaption>
        <b><img class="tiny" src="png/21-tile-fills.png" width="24" height="24" alt="">21 Dark tile, filling</b>
        <span>Posted days bright, the rest a tint of the tile. Cadence visible in the icon.</span>
      </figcaption>
    </figure><figure>
      <img class="big" src="png/22-tile-berry-ground.png" width="200" height="200" alt="Raspberry tile">
      <figcaption>
        <b><img class="tiny" src="png/22-tile-berry-ground.png" width="24" height="24" alt="">22 Raspberry tile</b>
        <span>Ground and figure swapped. The loudest thing here, and the best avatar.</span>
      </figcaption>
    </figure><figure>
      <img class="big" src="png/23-disc.png" width="200" height="200" alt="Raspberry disc">
      <figcaption>
        <b><img class="tiny" src="png/23-disc.png" width="24" height="24" alt="">23 Raspberry disc</b>
        <span>For the round crop LinkedIn and X both apply anyway.</span>
      </figcaption>
    </figure><figure>
      <img class="big" src="png/24-outline.png" width="200" height="200" alt="Outline">
      <figcaption>
        <b><img class="tiny" src="png/24-outline.png" width="24" height="24" alt="">24 Outline</b>
        <span>Every drupelet hollow. Lightest on the page, first to disappear at small sizes.</span>
      </figcaption>
    </figure></div>
